
name: Build Payesh APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir project
          unzip -q Payesh-v15.5-Source-ReadyForBuild.zip -d project

      - name: Add Persian fonts
        working-directory: project
        run: bash scripts/fetch-fonts.sh

      - name: Build APK
        working-directory: project
        run: gradle assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: Payesh-15.5-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
